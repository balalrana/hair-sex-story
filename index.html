{id:'submit',name:'আপনার গল্প পাঠান',desc:'আপনার লেখা গল্প জমা দিন',color:'var(--slate)'}

{id:2,title:'স্মৃতির উঠোন',author:'সালমা আক্তার',cat:'chachi',body:'এখানে গল্পের সম্পূর্ণ লেখা দেখানো হবে। এটি নমুনা গল্প; আপনার নিজস্ব গল্প যোগ হলে অনুমোদনের পর প্রকাশিত হবে।'},

];

const menuItems=document.getElementById('sideLinks');
menuItems.innerHTML=categories.map(c=>`<button type="button" onclick="navigateCategory('${c.id}')"><span class="menu-icon">${({ma:'♡',chachi:'✿',shashuri:'❀',all:'▤',gallery:'▧',submit:'✎'})[c.id]}</span><span>${c.name}</span></button>`).join('');
function toggleMenu(open){const side=document.getElementById('sideMenu'),shade=document.getElementById('menuShade'),toggle=document.getElementById('menuToggle');side.classList.toggle('open',open);shade.classList.toggle('open',open);side.setAttribute('aria-hidden',String(!open));toggle.setAttribute('aria-expanded',String(open));}
function navigateCategory(id){toggleMenu(false);if(id==='all')showAuthors();else if(id==='gallery')showGallery();else if(id==='submit')showSubmitForm();else showCategory(id);}
document.getElementById('menuToggle').addEventListener('click',()=>toggleMenu(!document.getElementById('sideMenu').classList.contains('open')));

const ADMIN_EMAIL='';
function head(title){return `<div class="section-head"><h2>${title}</h2><button class="back" onclick="home()">← বিভাগে ফিরুন</button></div>`}
function home(){page='home';app.innerHTML=`<div class="hero"><h2>গল্পের বিভাগসমূহ</h2><p>আপনার পছন্দের বিভাগ নির্বাচন করে গল্প পড়ুন</p></div><div class="hub">${categories.map(c=>`<div class="hub-card" onclick="${c.id==='all'?'showAuthors()':c.id==='gallery'?'showGallery()':c.id==='submit'?'showSubmitForm()':`showCategory('${c.id}')`}"><div class="circle" style="--tone:${c.color}"><span>${c.name}</span></div><small>${c.desc}</small></div>`).join('')}</div>`}
function showGallery(){page='gallery';const photos=[];app.innerHTML=head('ছবি গ্যালারী')+`<div class="gallery-grid">${photos.length?photos.map((src,i)=>`<figure class="gallery-item"><img src="${src}" alt="গ্যালারির ছবি ${i+1}" loading="lazy"></figure>`).join(''):'<div class="empty gallery-empty">ছবি গ্যালারীতে এখনো কোনো ছবি যোগ করা হয়নি।</div>'}</div>`}
function showCategory(id){page='category';let c=categories.find(x=>x.id===id);let arr=stories.filter(s=>s.cat===id);app.innerHTML=head(c.name)+`<div class="list">${arr.length?arr.map((s,i)=>`<button class="story-row" onclick="showStory(${s.id})"><span class="num">${i+1}</span><span>${esc(s.title)}</span><span class="row-arrow">›</span></button>`).join(''):'<div class="empty">এখনো কোনো গল্প প্রকাশিত হয়নি।</div>'}</div>`}
